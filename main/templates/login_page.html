{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StyleGenie</title>
    <link rel="stylesheet" href="{% static 'style.css' %}" />
  </head>
  <body>
    <div class="container">
      <!-- LEFT: Input Form -->
      <div class="left-panel">
        <h1>StyleGenie</h1>
        <form id="generateForm" enctype="multipart/form-data">
          {% csrf_token %}

          <div class="form-group">
            <label for="image">Upload up to 4 images:</label>
            <input
              type="file"
              name="image"
              id="imageInput"
              accept="image/*"
              multiple
              required
            />
            <div id="previewContainer"></div>
          </div>

          <div class="form-group">
            <label for="prompt">Custom Prompt:</label>
            <input
              type="text"
              name="prompt"
              placeholder="e.g. Make it elegant and red"
            />
          </div>

          <div class="form-group">
            <label for="style_tag">Select a Style:</label>
            <select name="style_tag">
              <option value="">-- Choose a style --</option>
              <option value="Casual">Casual</option>
              <option value="Minimalist">Minimalist</option>
              <option value="Evening Wear">Evening Wear</option>
              <option value="Sporty">Sporty</option>
              <option value="Streetwear">Streetwear</option>
              <option value="Business Casual">Business Casual</option>
            </select>
          </div>

          <button type="submit">Generate Outfit</button>
        </form>
      </div>

      <!-- RIGHT: Output Display -->
      <div class="right-panel">
        <div id="resultArea" style="display: none">
          <h2>Generated Image</h2>
          <p><strong>Prompt:</strong> <span id="resultPrompt"></span></p>
          <img id="resultImage" src="" alt="Generated Outfit" />
          <a
            id="downloadBtn"
            href="#"
            download="generated_outfit.webp"
            style="margin-top: 10px; color: #1976d2; display: none"
            >Download full resolution</a
          >
        </div>
      </div>
    </div>

    <!-- Image Zoom Modal -->
    <div id="imageModal">
      <img id="zoomedImage" src="" />
    </div>
    <script src="{% static 'main.js' %}"></script>
  </body>
</html>
