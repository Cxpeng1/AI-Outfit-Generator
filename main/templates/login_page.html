{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StyleGenie</title>
  </head>
  <body>
    <header class="navbar">
      <div class="logo">StyleGenie</div>
    </header>

    <h1>Upload a Clothing Item</h1>

    <form id="generateForm" enctype="multipart/form-data">
      {% csrf_token %}
      <label for="image">Upload Image:</label><br />
      <input type="file" name="image" required /><br /><br />

      <label for="prompt">Custom Prompt (optional):</label><br />
      <input
        type="text"
        name="prompt"
        placeholder="e.g. Make it elegant and red"
      /><br /><br />

      <label for="style_tag">Or select a style:</label><br />
      <select name="style_tag">
        <option value="">-- Choose a style --</option>
        <option value="Casual">Casual</option>
        <option value="Minimalist">Minimalist</option>
        <option value="Evening Wear">Evening Wear</option>
        <option value="Sporty">Sporty</option>
        <option value="Streetwear">Streetwear</option></select
      ><br /><br />

      <button type="submit">Generate Outfit</button>
    </form>

    <hr />

    <div id="resultArea" style="display: none">
      <h2>Generated Outfit</h2>
      <p><strong>Prompt:</strong> <span id="resultPrompt"></span></p>
      <p><strong>Generated Image:</strong></p>
      <img
        id="resultImage"
        src=""
        alt="Generated Outfit"
        style="max-width: 100%"
      />
    </div>

    <script>
      const form = document.getElementById("generateForm");
      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const formData = new FormData(form);

        const response = await fetch("/main/generate/", {
          method: "POST",
          body: formData,
          headers: {
            "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]")
              .value
          }
        });

        const data = await response.json();

        if (data.error) {
          featuring;
          alert("Error: " + data.error);
        } else {
          document.getElementById("resultPrompt").textContent =
            data.prompt_used;
          document.getElementById("resultImage").src = data.generated_image_url;
          document.getElementById("resultArea").style.display = "block";
        }
      });
    </script>
  </body>
</html>
